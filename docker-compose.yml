services:
    laravel-api:
        build:
            context: .
            dockerfile: Dockerfile
        image: laravel-api
        container_name: laravel-api
        restart: unless-stopped
        working_dir: /var/www/html
        ports:
            - "8001:80"
        volumes:
            - ./:/var/www/html
        networks:
            - laravel-network
        depends_on:
            laravel-db:
                condition: service_healthy

    laravel-db:
        image: mysql:8.0
        container_name: laravel-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-laravel}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - dbdata:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - laravel-network
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 5s
            retries: 10

    laravel-phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: laravel-phpmyadmin
        restart: unless-stopped
        platform: linux/amd64
        environment:
            PMA_HOST: laravel-db
            PMA_PORT: 3306
            PMA_ARBITRARY: 1
            PMA_USER: ${DB_USERNAME:-root}
            PMA_PASSWORD: ${DB_PASSWORD:-}
        ports:
            - "8081:80"
        networks:
            - laravel-network
        depends_on:
            - laravel-db

    laravel-mailhog:
        image: mailhog/mailhog
        container_name: laravel-mailhog
        restart: unless-stopped
        platform: linux/amd64
        ports:
            - "1026:1025"
            - "8026:8025"
        networks:
            - laravel-network

networks:
    laravel-network:
        driver: bridge

volumes:
    dbdata:
        driver: local
